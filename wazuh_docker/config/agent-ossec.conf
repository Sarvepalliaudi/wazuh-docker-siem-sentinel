<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux,ubuntu</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>
  <enrollment>
    <enabled>yes</enabled>
    <manager_address>wazuh.manager</manager_address>
    <port>1515</port>
    <agent_name>local-log-agent</agent_name>
  </enrollment>
  <localfile>
    <location>/host-logs/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/host-logs/syslog</location>
    <log_format>syslog</log_format>
  </localfile>
  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
